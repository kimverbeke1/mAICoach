# .github/workflows/sync-mAIcoach.yml
#
# Uur-gebaseerde intervals.icu-synchronisatie voor mAICoach.
# Draait AICoach/sync_latest.py en schrijft history, wellness en activities
# naar GCS. De Streamlit-app doet zelf geen live intervals.icu-aanroep meer;
# ze leest enkel de gesynchroniseerde data terug uit de bucket.
#
# Vereiste repo secrets (Settings -> Secrets and variables -> Actions):
#   INTERVALS_API_KEY             - API-key van intervals.icu
#   INTERVALS_ATHLETE_ID          - athlete-ID (bv. i123456)
#   FIREBASE_SERVICE_ACCOUNT_JSON - Firestore-toegang
#   GCS_SERVICE_ACCOUNT_JSON      - GCP-service-account als platte JSON-string
#                                   (zelfde account als de [gcp_service_account]-
#                                   sectie in Streamlit Cloud secrets)
#   GCS_BUCKET                    - naam van de GCS-bucket
#
# GCS gebruikt een ander credential-mechanisme dan Firestore: buiten een
# Streamlit-runtime bestaat st.secrets niet, dus valt gcs_store.py terug op
# GOOGLE_APPLICATION_CREDENTIALS - een pad naar een JSON-bestand. Vandaar de
# stap die het secret eerst naar een tijdelijk bestand schrijft.

name: Sync mAICoach data (intervals.icu)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-maicoach
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Schrijf GCS-service-account naar tijdelijk bestand
        run: |
          echo '${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}' > "${{ runner.temp }}/gcs-service-account.json"

      - name: Run mAICoach-synchronisatie
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcs-service-account.json
        run: |
          python -m AICoach.sync_latest

      - name: Ruim tijdelijke credential-file op
        if: always()
        run: |
          rm -f "${{ runner.temp }}/gcs-service-account.json"
