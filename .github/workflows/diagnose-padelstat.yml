# .github/workflows/diagnose-padelstat.yml
#
# Eenmalige, HANDMATIG te starten workflow om diagnose_padelstat_search.py
# in de cloud te draaien (GitHub Actions heeft, in tegenstelling tot
# Streamlit Community Cloud, wel een browser/Playwright beschikbaar -- zie
# scrape-padel.yml, dat dezelfde aanpak gebruikt voor de reguliere scrape).
#
# Doel: uitzoeken WAAROM padelstats_scraper.search_and_fetch_padelstat_rating()
# voor bepaalde spelers (De Pourcq Hilde, Breda Hilde, Mondy Severine,
# Vanlerberghe Vivianne) niets teruggeeft, zonder dat Kim dit lokaal met een
# zichtbare browser moet testen.
#
# Voorwaarde: diagnose_padelstat_search.py moet in PadelAnalysis/scraper/
# staan (zelfde map als padelstats_scraper.py).
#
# --------------------------------------------------------------------------
# PADEL_ANALYSIS_PREBUILT_DOCKER_IMAGE_2026-09-19 (op verzoek van Kim: "docker
# image" - performance-item; gevonden bij het nalopen van ALLE workflow-
# bestanden op verzoek van Kim, chat 2026-09-19: "dit zijn al mijn yml files
# om te checken")
# --------------------------------------------------------------------------
# ROOT CAUSE: dit bestand had, in tegenstelling tot alle andere Playwright-
# gebruikende workflows, HELEMAAL GEEN caching — elke (handmatige) run deed
# een volledige "pip install -r requirements-scraper.txt" +
# "playwright install --with-deps chromium" vanaf nul. Het was ook nooit
# meegenomen in de overstap naar de vooraf-gebouwde Docker-image (zie
# build-scraper-image.yml, dat destijds expliciet slechts "4 scrape/
# refresh-workflows" vermeldde).
# FIX: draait nu, net als de andere Playwright-workflows, rechtstreeks in
# het vooraf-gebouwde image (zie PadelAnalysis/scraper/Dockerfile +
# .github/workflows/build-scraper-image.yml) - geen enkele installatiestap
# meer nodig. Aangezien dit een zeldzaam, handmatig gebruikt diagnose-
# script is (geen dagelijkse/wekelijkse cron), is de tijdswinst hier vooral
# comfort bij ad-hoc gebruik, geen structurele noodzaak zoals bij de
# geplande workflows.
#
# Gebruik:
#   GitHub -> Actions -> "Diagnose padelstat search" -> Run workflow
#   -> vul bij 'namen' de te testen spelernamen in, komma-gescheiden, bv.:
#      Mondy Severine, Vanlerberghe Vivianne
#   Na afloop: klik de run open -> stap "Diagnose uitvoeren" -> volledige
#   tekstoutput staat in de log. Er wordt GEEN Firestore/Firebase-toegang
#   gebruikt; dit script leest/schrijft niets, het test enkel padelstats.be.
name: Diagnose padelstat search
on:
  workflow_dispatch:
    inputs:
      namen:
        description: "Spelernamen, komma-gescheiden (bv. 'Mondy Severine, Vanlerberghe Vivianne')"
        required: true
        default: "Mondy Severine, Vanlerberghe Vivianne"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/kimverbeke1/padelanalysis-scraper:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: PadelAnalysis/scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Diagnose uitvoeren
        run: |
          IFS=',' read -ra NAMEN_ARRAY <<< "${{ github.event.inputs.namen }}"
          TRIMMED_NAMEN=()
          for naam in "${NAMEN_ARRAY[@]}"; do
            TRIMMED_NAMEN+=("$(echo "$naam" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')")
          done
          python diagnose_padelstat_search.py --headless "${TRIMMED_NAMEN[@]}"
