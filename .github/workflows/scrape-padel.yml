# .github/workflows/scrape-padel.yml
#
# Automatische PadelAnalysis-scrape via GitHub Actions.
# Draait Playwright (met browser-binaries, iets wat Streamlit Community
# Cloud NIET ondersteunt) om spelers te verversen en de resultaten
# rechtstreeks naar Firestore te schrijven. De gedeployde Streamlit-app
# (mAICoach + PadelAnalysis) leest enkel uit Firestore en hoeft dus zelf
# niets te scrapen.
#
# Vereist repo secret: FIREBASE_SERVICE_ACCOUNT_JSON
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Naam:   FIREBASE_SERVICE_ACCOUNT_JSON
#   Waarde: volledige inhoud van je (geroteerde) firebase-key.json bestand.
#
# FIX 2026-09-07 (v2) — "de setup-stappen voor het scrapen mogen dagelijks
# vooraf draaien zodat een handmatige scrape voor de gebruiker veel sneller
# gaat":
# De trage stappen zijn (a) 'pip install' van alle dependencies en (b) de
# Playwright Chromium-download (~150-300MB). We houden die nu DAGELIJKS warm
# en slaan ze op een warme run VOLLEDIG over (venv-cache + Playwright-
# browsercache, zie de cache-stappen hieronder). Dit blijft ONGEWIJZIGD -
# enkel de TRIGGER (hieronder) is aangepakt.
#
# --------------------------------------------------------------------------
# PADEL_ANALYSIS_CRON_UNRELIABLE_2026-09-17 (op verzoek van Kim)
# --------------------------------------------------------------------------
# BUG (opgelost): deze workflow gebruikte "schedule: cron: '0 5 * * *'" als
# enige automatische trigger. GitHub's eigen documentatie erkent dat
# schedule-triggers vertraagd of stilzwijgend OVERGESLAGEN kunnen worden bij
# piekbelasting op hun gedeelde infrastructuur - zonder foutmelding, zonder
# notificatie. Dit was AL bevestigd problematisch voor een andere workflow
# in deze repo (sync-mAIcoach.yml, PADEL_ANALYSIS_CRON_OFFSET_FIX_2026-09-15
# / GCP_SCHEDULER_TRIGGER_2026-09-16) en is zeer waarschijnlijk (mede)
# verantwoordelijk voor waarom automatische padelstat-/klassement-
# verrijking voor gescoute tegenstanders niet consistent doorloopt: als deze
# workflow onregelmatig of helemaal niet draait, krijgt geen enkele speler
# ooit de kans om via de geplande, automatische weg verrijkt te worden.
#
# Fix: de "schedule:"-trigger is volledig verwijderd. Een externe GCP Cloud
# Scheduler-job (harde SLA, retries, zichtbare run-historiek) roept nu elk
# uur/dag de workflow_dispatch-API van GitHub aan via dezelfde GitHub
# App-gebaseerde Cloud Run function die al gebruikt wordt voor
# sync-mAIcoach.yml (zie gcp-triggers/maicoach-sync-trigger/main.py, nu
# generiek gemaakt zodat 1 function BEIDE workflows kan triggeren via een
# workflow_file-parameter in de aanroep). workflow_dispatch blijft ALTIJD
# ook handmatig bruikbaar via de Actions-tab, met dezelfde inputs
# (player_ids/mode) als voorheen.
name: Scrape Padel Data
on:
  workflow_dispatch:
    inputs:
      player_ids:
        description: "Komma-gescheiden player_id's om te verversen (leeg = alle spelers)"
        required: false
        default: ""
      mode:
        description: "missing (enkel ontbrekende/huidige periode, snelst) | new_users | full"
        required: false
        default: "missing"
        type: choice
        options:
          - missing
          - new_users
          - full
# Voorkom dat een geplande run en een handmatige run tegelijk dezelfde
# Firestore-data schrijven. We annuleren NIET (cancel-in-progress: false),
# zodat een lopende scrape netjes mag afronden en de volgende erna start.
concurrency:
  group: scrape-padel
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PadelAnalysis/scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Lichte pip-index/wheel cache van setup-python zelf. Dit maakt een
          # eventuele KOUDE (cache-miss) venv-installatie extra snel; op een
          # warme run wordt pip sowieso volledig overgeslagen (zie hieronder).
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            PadelAnalysis/scraper/requirements-scraper.txt
      # ── Volledige venv-cache ────────────────────────────────────────────
      # Cachet de complete geïnstalleerde omgeving. GEEN restore-keys: enkel
      # een EXACTE hash-match telt, zodat een warme run gegarandeerd exact de
      # juiste dependencies terugkrijgt (en we nooit per ongeluk een oude
      # venv met verkeerde packages hergebruiken na een requirements-wijziging).
      - name: Cache Python-venv (alle pip-packages + playwright)
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: PadelAnalysis/scraper/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt', 'PadelAnalysis/scraper/requirements-scraper.txt') }}
      - name: Bouw venv + installeer dependencies (alleen bij cache-miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
          pip install -r requirements-scraper.txt
      - name: Bevestig venv aanwezig (warme run)
        if: steps.cache-venv.outputs.cache-hit == 'true'
        run: |
          echo "Venv-cache-hit: pip install volledig overgeslagen."
          . .venv/bin/activate
          python -c "import playwright, bs4, requests; print('deps OK uit cache')"
      # ── Playwright-browsercache ─────────────────────────────────────────
      # Playwright-versie uitlezen (uit de venv) zodat de browser-cache-key
      # automatisch verandert zodra je de Playwright-versie optrekt -> forceert
      # dan een verse Chromium-download i.p.v. een verouderde gecachte versie.
      - name: Bepaal Playwright-versie (voor cache-key)
        id: playwright-version
        run: |
          . .venv/bin/activate
          echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright-browserbinaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers (Chromium binary + OS-libraries)
        # Enkel bij een cache-miss: downloadt de Chromium-binary én zet de
        # OS-libraries. Dit is de dominante tijdskost op een koude run.
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          . .venv/bin/activate
          python -m playwright install --with-deps chromium
      - name: Installeer enkel OS-libraries (bij browser-cache-hit)
        # Bij een cache-hit is de browserbinary al aanwezig (uit de cache),
        # maar de OS-libraries staan niet in die map en zijn op een verse
        # runner telkens opnieuw nodig. Deze stap zet enkel die system-deps
        # (snel), zonder de browserbinary opnieuw te downloaden.
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: |
          . .venv/bin/activate
          python -m playwright install-deps chromium
      - name: Run padel scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # github.event.inputs is leeg bij een 'schedule'-trigger (geen
          # workflow_dispatch), dan vallen PLAYER_IDS/MODE terug op lege
          # strings -- ci_scrape_all.py interpreteert dat zelf al correct
          # als "alle spelers" / mode "missing" (zie DEFAULT_MODE aldaar).
          PLAYER_IDS: ${{ github.event.inputs.player_ids }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          . .venv/bin/activate
          python ci_scrape_all.py
