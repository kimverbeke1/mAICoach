# .github/workflows/scrape-padel.yml
#
# PadelAnalysis-scrape via GitHub Actions — UITSLUITEND handmatig te starten
# (geen automatische dagelijkse/periodieke run). Draait Playwright (met
# browser-binaries, iets wat Streamlit Community Cloud NIET ondersteunt) om
# spelers te verversen en de resultaten rechtstreeks naar Firestore te
# schrijven. De gedeployde Streamlit-app leest enkel uit Firestore en hoeft
# zelf niets te scrapen.
#
# Vereist repo secret: FIREBASE_SERVICE_ACCOUNT_JSON
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Naam:   FIREBASE_SERVICE_ACCOUNT_JSON
#   Waarde: volledige inhoud van je (geroteerde) firebase-key.json bestand
#           (gewoon de hele JSON-tekst plakken, inclusief { } en newlines
#           in private_key — niets extra escapen).
#
# Starten: GitHub -> tabblad "Actions" -> "Scrape Padel Data" -> "Run workflow"
#   - Veld "player_ids" LEEG laten  -> ALLE gekende spelers verversen.
#   - Veld "player_ids" invullen    -> enkel die speler(s) verversen,
#                                      komma-gescheiden, bv. 214435,198221

name: Scrape Padel Data

on:
  workflow_dispatch:
    inputs:
      player_ids:
        description: "Player ID's om te verversen, komma-gescheiden (leeg = alle spelers)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: PadelAnalysis/scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run padel scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAYER_IDS: ${{ github.event.inputs.player_ids }}
        run: python ci_scrape_all.py
