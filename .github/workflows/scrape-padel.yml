# .github/workflows/scrape-padel.yml
#
# Automatische PadelAnalysis-scrape via GitHub Actions.
# Draait Playwright (met browser-binaries, iets wat Streamlit Community
# Cloud NIET ondersteunt) om spelers te verversen en de resultaten
# rechtstreeks naar Firestore te schrijven. De gedeployde Streamlit-app
# (mAICoach + PadelAnalysis) leest enkel uit Firestore en hoeft dus zelf
# niets te scrapen.
#
# Vereist repo secret: FIREBASE_SERVICE_ACCOUNT_JSON
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Naam:   FIREBASE_SERVICE_ACCOUNT_JSON
#   Waarde: volledige inhoud van je (geroteerde) firebase-key.json bestand.
#
# FIX 2026-09-07 — "install-stappen draaien elke run helemaal opnieuw":
# Elke workflow-run start op een compleet lege GitHub-runner (dat is
# normaal en onvermijdelijk), maar zonder caching werd bij ELKE run
# opnieuw (a) alle pip-packages gedownload/geïnstalleerd EN (b) de volledige
# Playwright Chromium-browser (~150-300MB) gedownload -- veruit de traagste
# stap, en volledig herhaalbaar/onnodig als er sinds de vorige run niets
# aan de dependencies veranderd is.
# Toegevoegd:
#   1. actions/cache voor de pip-downloadcache (naast de reeds bestaande
#      lichte 'cache: pip' optie van setup-python, die vooral de
#      package-index cachet, niet de effectief gedownloade wheels).
#   2. actions/cache voor de Playwright-browserbinaries (~/.cache/ms-playwright),
#      met een cache-key gebaseerd op de Playwright-versie EN de OS-naam
#      (browserbinaries zijn platform-specifiek). Bij een cache-hit wordt
#      'playwright install --with-deps chromium' overgeslagen; bij een
#      cache-miss (bv. na een Playwright-versie-upgrade) draait die stap
#      gewoon zoals voorheen en wordt het resultaat voor de VOLGENDE run
#      opnieuw gecached.
# Verwacht effect: een "warme" run (cache-hit op beide) zou een groot deel
# van de installatietijd moeten overslaan; een "koude" run (eerste keer, of
# na een dependency-wijziging) duurt ongeveer even lang als voorheen, maar
# bouwt daarbij de cache op voor alle volgende runs.
name: Scrape Padel Data
on:
  schedule:
    # 05:00 UTC = 07:00 zomertijd / 06:00 wintertijd in België
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      player_ids:
        description: "Komma-gescheiden player_id's om te verversen (leeg = alle spelers)"
        required: false
        default: ""
      mode:
        description: "missing (enkel ontbrekende/huidige periode, snelst) | new_users | full"
        required: false
        default: "missing"
        type: choice
        options:
          - missing
          - new_users
          - full
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PadelAnalysis/scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            PadelAnalysis/scraper/requirements-scraper.txt

      - name: Install Python dependencies (algemeen)
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt

      - name: Install Playwright (Python package, enkel voor deze workflow)
        run: pip install -r requirements-scraper.txt

      # Playwright-versie uitlezen zodat de cache-key automatisch verandert
      # (en dus automatisch een nieuwe download forceert) zodra je ooit de
      # Playwright-versie in requirements-scraper.txt optrekt -- voorkomt
      # dat een verouderde/incompatibele gecachete browserversie gebruikt
      # wordt na een dependency-upgrade.
      - name: Bepaal Playwright-versie (voor cache-key)
        id: playwright-version
        run: |
          echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright-browserbinaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (Chromium binary + OS-libraries)
        # Bij een cache-hit worden de browserbinaries zelf overgeslagen via
        # --dry-run false hieronder is NIET van toepassing -- we gebruiken
        # in plaats daarvan de cache-hit output om de hele stap over te
        # slaan wanneer de binaries al aanwezig zijn. --with-deps installeert
        # ook OS-niveau libraries (apt) die niet in de gebruikersspecifieke
        # cache-map zitten; die zijn op een verse ubuntu-latest runner sowieso
        # telkens opnieuw nodig (worden door apt zelf al efficiënt afgehandeld
        # en zijn niet de dominante tijdskost hier -- de browserbinary-download
        # zelf is dat wel).
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Installeer enkel ontbrekende OS-libraries (bij cache-hit)
        # Bij een cache-hit slaan we de VOLLEDIGE install over (incl. de
        # browserbinary-download), maar de OS-niveau libraries (apt-deps)
        # staan niet in de gecachete map en moeten op een verse runner
        # alsnog aanwezig zijn. Dit installeert enkel die system-deps,
        # zonder de browserbinary opnieuw te downloaden.
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run padel scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # github.event.inputs is leeg bij een 'schedule'-trigger (geen
          # workflow_dispatch), dan vallen PLAYER_IDS/MODE terug op lege
          # strings -- ci_scrape_all.py interpreteert dat zelf al correct
          # als "alle spelers" / mode "missing" (zie DEFAULT_MODE aldaar).
          PLAYER_IDS: ${{ github.event.inputs.player_ids }}
          MODE: ${{ github.event.inputs.mode }}
        run: python ci_scrape_all.py
