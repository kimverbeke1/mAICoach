# .github/workflows/scrape-padel.yml
#
# Automatische PadelAnalysis-scrape via GitHub Actions.
# Draait Playwright (met browser-binaries, iets wat Streamlit Community
# Cloud NIET ondersteunt) om spelers te verversen en de resultaten
# rechtstreeks naar Firestore te schrijven. De gedeployde Streamlit-app
# (mAICoach + PadelAnalysis) leest enkel uit Firestore en hoeft dus zelf
# niets te scrapen.
#
# Vereist repo secret: FIREBASE_SERVICE_ACCOUNT_JSON
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Naam:   FIREBASE_SERVICE_ACCOUNT_JSON
#   Waarde: volledige inhoud van je (geroteerde) firebase-key.json bestand.
#
# --------------------------------------------------------------------------
# PADEL_ANALYSIS_PREBUILT_DOCKER_IMAGE_2026-09-19 (op verzoek van Kim: "docker
# image" - performance-item)
# --------------------------------------------------------------------------
# ROOT CAUSE opgelost: deze workflow had voorheen een uitgebreide venv-cache +
# Playwright-browsercache-constructie (pip install + playwright install
# --with-deps chromium, met cache-restore als "snel pad"). Dat werkte, maar
# een cache-RESTORE kost nog altijd tijd, en moest in 4 aparte workflows
# (deze + de 3 refresh-*.yml) apart onderhouden worden.
# FIX: draait voortaan rechtstreeks in het vooraf-gebouwde image (zie
# PadelAnalysis/scraper/Dockerfile + .github/workflows/build-scraper-image.yml),
# waarin de Python-dependencies EN de Chromium-browserbinary AL geïnstalleerd
# zitten. Geen enkele installatie-/cache-stap meer nodig - enkel
# `actions/checkout` + het scraper-script draaien. Dit is zowel eenvoudiger
# als sneller dan een cache-hit (geen restore-tijd, geen cache-key-logica).
#
# PADEL_ANALYSIS_CRON_UNRELIABLE_2026-09-17 (ongewijzigd, blijft gelden):
# schedule-triggers kunnen door GitHub stilzwijgend overgeslagen worden bij
# piekbelasting. Deze workflow heeft daarom GEEN "schedule:"-trigger meer -
# een externe GCP Cloud Scheduler-job roept de workflow_dispatch-API aan.
# workflow_dispatch blijft ook gewoon handmatig bruikbaar via de Actions-tab.
name: Scrape Padel Data
on:
  workflow_dispatch:
    inputs:
      player_ids:
        description: "Komma-gescheiden player_id's om te verversen (leeg = alle spelers)"
        required: false
        default: ""
      mode:
        description: "missing (enkel ontbrekende/huidige periode, snelst) | new_users | full"
        required: false
        default: "missing"
        type: choice
        options:
          - missing
          - new_users
          - full
# Voorkom dat een geplande run en een handmatige run tegelijk dezelfde
# Firestore-data schrijven. We annuleren NIET (cancel-in-progress: false),
# zodat een lopende scrape netjes mag afronden en de volgende erna start.
concurrency:
  group: scrape-padel
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/kimverbeke1/padelanalysis-scraper:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: PadelAnalysis/scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run padel scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # github.event.inputs is leeg bij een niet-workflow_dispatch-trigger,
          # dan vallen PLAYER_IDS/MODE terug op lege strings -- ci_scrape_all.py
          # interpreteert dat zelf al correct als "alle spelers" / mode
          # "missing" (zie DEFAULT_MODE aldaar).
          PLAYER_IDS: ${{ github.event.inputs.player_ids }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python ci_scrape_all.py
