# Handmatige workflow om Padel-spelersdata te verversen.
# GitHub -> tabblad "Actions" -> "Padel data verversen" -> "Run workflow"
#
# Vereist repo secret FIREBASE_SERVICE_ACCOUNT_JSON (Settings -> Secrets and
# variables -> Actions), met de volledige inhoud van firebase-key.json.

name: Padel data verversen

on:
  workflow_dispatch:
    inputs:
      player_ids:
        description: "Specifieke speler(s), komma-gescheiden (leeg = iedereen)"
        required: false
        default: ""
      mode:
        description: "Wat verversen?"
        required: false
        default: "missing"
        type: choice
        options:
          - missing
          - new_users
          - full

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: PadelAnalysis/scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
          pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Data verversen
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAYER_IDS: ${{ github.event.inputs.player_ids }}
          MODE: ${{ github.event.inputs.mode }}
        run: python ci_scrape_all.py
