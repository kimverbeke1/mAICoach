# .github/workflows/refresh-klassement.yml
#
# Dagelijkse, VOLLEDIG GEÏSOLEERDE controle/herstel van de TVL-
# klassementshistoriek voor alle spelers (eigen team + tegenstanders).
#
# Bewust een APARTE workflow, losgekoppeld van scrape-padel.yml (matchdata)
# EN van refresh-padelstat.yml (padelstats.be):
#   - klassement scrapen is per speler trager (meerdere periodes na elkaar
#     doorlopen), dus een kleinere batch per run dan padelstat;
#   - klassement bestond tot nu toe UITSLUITEND als lokale, handmatige actie
#     (checkbox in opponent_scout_ui.py), die op de gedeployde app niets
#     deed (is_scraping_available() == False daar). Deze workflow is de
#     structurele, server-side vervanging daarvan.
#
# Verwerkt STANDAARD max 15 spelers per run (zie KLASSEMENT_MAX hieronder).
# Wie deze run niet aan bod komt, wordt de VOLGENDE dagelijkse run opgepikt.
#
# Bevat een EENMALIG zelfherstel-mechanisme (zie refresh_klassement_only.py)
# voor spelers die vóór de PADEL_ANALYSIS_KLASSEMENT_COOKIE_VERIFY_FIX_
# 2026-09-17 al eens (kapot) gescraped zijn: hun quasi-lege 'Huidige
# pagina'-fallback-historiek wordt automatisch, met voorrang, opnieuw
# geprobeerd.
#
# --------------------------------------------------------------------------
# PADEL_ANALYSIS_WORKFLOW_SPEEDUP_2026-09-19 (Fase E, op verzoek van Kim:
# zie de volledige toelichting in refresh-padelstat.yml — dezelfde
# bevinding en fix gelden hier 1-op-1.)
# --------------------------------------------------------------------------
# FIX: dezelfde venv-/Playwright-browsercache-stappen als scrape-padel.yml/
# search-player.yml/refresh-padelstat.yml, met IDENTIEKE cache-keys, zodat
# alle workflows dezelfde cache-entries hergebruiken (een cache-hit door
# bv. scrape-padel.yml maakt deze workflow dus OOK meteen warm, en
# omgekeerd) i.p.v. elk hun eigen, aparte, redundante cache op te bouwen.
#
# Vereiste repo secret (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT_JSON - Firestore-toegang (zelfde secret als
#                                   scrape-padel.yml/refresh-padelstat.yml)
#
# Handmatig testen/forceren: Actions -> Refresh klassement -> Run workflow,
# met desgewenst een aangepaste 'max', 'force_all' of 'player' input.
name: Refresh klassement (tennisenpadelvlaanderen.be)
on:
  schedule:
    # Dagelijks om 04:22 UTC. Bewust een ander tijdstip dan refresh-
    # padelstat.yml (04:07) en scrape-padel.yml, en bewust NIET op het volle
    # uur (bekende GitHub Actions schedule-onbetrouwbaarheid rond :00). Een
    # gemiste dag is onschuldig: de volgende dag pikt gewoon verder op.
    - cron: "22 4 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Max aantal spelers deze run"
        required: false
        default: "15"
      max_periods:
        description: "Max periodes per speler deze run (leeg = alle periodes)"
        required: false
        default: ""
      force_all:
        description: "Iedereen opnieuw controleren, ongeacht versie-marker (true/false)"
        required: false
        default: "false"
      player:
        description: "Enkel dit ene player_id controleren (optioneel, laat leeg voor normale werking)"
        required: false
        default: ""
concurrency:
  group: refresh-klassement
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    # Ruim onder de 30-minuten-limiet die scrape-padel.yml eerder deed
    # vastlopen: bij KLASSEMENT_MAX=15 en meerdere periodes per speler
    # (~20-40s per speler, afhankelijk van het aantal periodes) blijft dit
    # ruim binnen 25 minuten.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PadelAnalysis/scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            PadelAnalysis/scraper/requirements-scraper.txt
      # ── Volledige venv-cache (PADEL_ANALYSIS_WORKFLOW_SPEEDUP_2026-09-19:
      # identiek aan scrape-padel.yml/search-player.yml/refresh-padelstat.yml,
      # zelfde cache-key). ─────────────────────────────────────────────────
      - name: Cache Python-venv (alle pip-packages + playwright)
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: PadelAnalysis/scraper/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt', 'PadelAnalysis/scraper/requirements-scraper.txt') }}
      - name: Bouw venv + installeer dependencies (alleen bij cache-miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
          pip install -r requirements-scraper.txt
      - name: Bevestig venv aanwezig (warme run)
        if: steps.cache-venv.outputs.cache-hit == 'true'
        run: |
          echo "Venv-cache-hit: pip install volledig overgeslagen."
          . .venv/bin/activate
          python -c "import playwright, bs4, requests; print('deps OK uit cache')"
      # ── Playwright-browsercache (identiek aan scrape-padel.yml) ─────────
      - name: Bepaal Playwright-versie (voor cache-key)
        id: playwright-version
        run: |
          . .venv/bin/activate
          echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright-browserbinaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers (Chromium binary + OS-libraries)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          . .venv/bin/activate
          python -m playwright install --with-deps chromium
      - name: Installeer enkel OS-libraries (bij browser-cache-hit)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: |
          . .venv/bin/activate
          python -m playwright install-deps chromium
      - name: Klassement-controle uitvoeren
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          KLASSEMENT_MAX: ${{ github.event.inputs.max || '15' }}
          KLASSEMENT_MAX_PERIODS: ${{ github.event.inputs.max_periods }}
        run: |
          . .venv/bin/activate
          ARGS="--max ${KLASSEMENT_MAX}"
          if [ -n "${KLASSEMENT_MAX_PERIODS}" ]; then
            ARGS="$ARGS --max-periods-per-player ${KLASSEMENT_MAX_PERIODS}"
          fi
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            ARGS="$ARGS --force-all"
          fi
          if [ -n "${{ github.event.inputs.player }}" ]; then
            ARGS="$ARGS --player ${{ github.event.inputs.player }}"
          fi
          echo "Uitvoeren: python refresh_klassement_only.py $ARGS"
          python refresh_klassement_only.py $ARGS
