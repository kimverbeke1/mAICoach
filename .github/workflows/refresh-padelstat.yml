# .github/workflows/refresh-padelstat.yml
#
# Wekelijkse (elke maandag), volledig geïsoleerde controle/herstel van
# padelstats.be playing strength voor alle spelers (eigen team + tegenstanders).
#
# Bewust een APARTE workflow, losgekoppeld van scrape-padel.yml (matchdata):
#   - scrape-padel.yml liep vast op de 30-minuten-limiet naarmate de
#     spelerslijst groeide; dit script mag daar niet opnieuw tegenaan lopen.
#   - "een speler verversen" loste padelstat-problemen tot nu toe niet op
#     (zie refresh_padelstat_only.py se moduledocstring: PADELSTAT_LOGIC_
#     VERSION-zelfherstel-mechanisme). Dit is de gerichte, op zichzelf
#     staande oplossing daarvoor, om onafhankelijk van de bredere
#     timeout-fix al te kunnen draaien.
#
# Verwerkt STANDAARD max 55 spelers per run (zie PADELSTAT_MAX hieronder).
# Wie deze run niet aan bod komt, wordt de VOLGENDE wekelijkse run opgepikt.
#
# LET OP: naast deze wekelijkse achtergrondtaak wordt padelstat ook
# AUTOMATISCH geforceerd ververst telkens Kim op "Tegenstander
# analyseren"/"Verversen" klikt in de Team-analyse (zie
# opponent_scout_ui.py: _run_scout_and_scrape() en opponent_analysis.py:
# render_team_header()) - dat garandeert de meest actuele waarde exact op
# het moment dat de analyse gebeurt, i.p.v. te moeten wachten op de
# eerstvolgende maandag.
#
# --------------------------------------------------------------------------
# PADEL_ANALYSIS_PREBUILT_DOCKER_IMAGE_2026-09-19 (op verzoek van Kim: "docker
# image" - performance-item)
# --------------------------------------------------------------------------
# ROOT CAUSE opgelost: deze workflow installeerde tot nu toe, bij ELKE run,
# vanaf nul de Python-dependencies EN de Chromium-browserbinary via
# `playwright install --with-deps chromium` - ZONDER enige cache (in
# tegenstelling tot scrape-padel.yml, dat wel al een cache-laag had). Dat
# kostte structureel 1-2 minuten pure setup-tijd, elke week opnieuw, los van
# het eigenlijke padelstat-scrapen.
# FIX: draait voortaan rechtstreeks in het vooraf-gebouwde image (zie
# PadelAnalysis/scraper/Dockerfile + .github/workflows/build-scraper-image.yml),
# waarin de Python-dependencies EN de Chromium-browserbinary AL geïnstalleerd
# zitten. Geen enkele installatiestap meer nodig.
#
# Vereiste repo secret (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT_JSON - Firestore-toegang (zelfde secret als
#                                   scrape-padel.yml/sync-mAIcoach.yml)
#
# Handmatig testen/forceren: Actions -> Refresh padelstat -> Run workflow,
# met desgewenst een aangepaste 'max' of 'force_all' input.
name: Refresh padelstat (padelstats.be)
on:
  schedule:
    # Wekelijks, enkel op MAANDAG (cron day-of-week: 1 = maandag), om 04:07
    # UTC. Bewust NIET op scrape-padel.yml se eigen cron-tijdstip, en bewust
    # NIET op het volle uur (zie de bekende GitHub Actions
    # schedule-onbetrouwbaarheid rond :00). Een gemiste week is onschuldig:
    # de volgende maandag pikt gewoon verder op - en elke "Tegenstander
    # analyseren"-klik ververst ondertussen sowieso al gericht de relevante
    # spelers (zie hierboven).
    - cron: "7 4 * * 1"
  workflow_dispatch:
    inputs:
      max:
        description: "Max aantal spelers deze run"
        required: false
        default: "55"
      force_all:
        description: "Iedereen opnieuw controleren, ongeacht versie-marker (true/false)"
        required: false
        default: "false"
      player:
        description: "Enkel dit ene player_id controleren (optioneel, laat leeg voor normale werking)"
        required: false
        default: ""
concurrency:
  group: refresh-padelstat
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    # Ruim onder de 30-minuten-limiet die scrape-padel.yml deed vastlopen:
    # bij PADELSTAT_MAX=55 en ~15-30s per speler blijft dit ruim binnen 25
    # minuten. Expliciet begrensd zodat een onverwacht trage run wordt
    # afgebroken i.p.v. de volgende wekelijkse run te blokkeren.
    timeout-minutes: 25
    container:
      image: ghcr.io/kimverbeke1/padelanalysis-scraper:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Padelstat-controle uitvoeren
        working-directory: PadelAnalysis/scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PADELSTAT_MAX: ${{ github.event.inputs.max || '55' }}
        run: |
          ARGS="--max ${PADELSTAT_MAX}"
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            ARGS="$ARGS --force-all"
          fi
          if [ -n "${{ github.event.inputs.player }}" ]; then
            ARGS="$ARGS --player ${{ github.event.inputs.player }}"
          fi
          echo "Uitvoeren: python refresh_padelstat_only.py $ARGS"
          python refresh_padelstat_only.py $ARGS
